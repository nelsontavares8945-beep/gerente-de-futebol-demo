name: Compilar APK do jogo
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Criar projeto Android
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/br/com/gerentefutebol android/app/src/main/assets android/app/src/main/res/drawable
          cp index.html android/app/src/main/assets/index.html
          cp icon-192.png android/app/src/main/res/drawable/icon.png
          cat > android/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'GerenteFutebol'
          include ':app'
          EOF
          cat > android/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.6.1' apply false }
          EOF
          cat > android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'br.com.gerentefutebol'
            compileSdk 35
            defaultConfig { applicationId 'br.com.gerentefutebol'; minSdk 23; targetSdk 28; versionCode 1; versionName '1.0' }
          }
          EOF
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:label="Gerente de Futebol" android:icon="@drawable/icon" android:theme="@android:style/Theme.Material.NoActionBar" android:usesCleartextTraffic="false" android:allowBackup="true">
              <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="landscape" android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > android/app/src/main/java/br/com/gerentefutebol/MainActivity.java <<'EOF'
          package br.com.gerentefutebol;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import java.io.IOException;
          public class MainActivity extends Activity {
            private WebView game;
            @Override public void onCreate(Bundle state) {
              super.onCreate(state);
              getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_STABLE);
              game = new WebView(this);
              game.getSettings().setJavaScriptEnabled(true);
              game.getSettings().setDomStorageEnabled(true);
              game.getSettings().setMediaPlaybackRequiresUserGesture(false);
              game.setWebChromeClient(new WebChromeClient());
              game.setWebViewClient(new WebViewClient() {
                @Override public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                  if (request.getUrl().toString().equals("https://game.gerentefutebol.local/index.html")) {
                    try { return new WebResourceResponse("text/html", "UTF-8", getAssets().open("index.html")); } catch (IOException e) { return null; }
                  }
                  return super.shouldInterceptRequest(view, request);
                }
                @Override public void onPageFinished(WebView view, String url) {
                  view.evaluateJavascript("(function(){var b=document.getElementById('installApp');if(b)b.style.display='none';})()", null);
                }
              });
              setContentView(game);
              if (state != null) game.restoreState(state); else game.loadUrl("https://game.gerentefutebol.local/index.html");
            }
            @Override public void onSaveInstanceState(Bundle out) { super.onSaveInstanceState(out); game.saveState(out); }
            @Override public void onBackPressed() { if (game.canGoBack()) game.goBack(); else super.onBackPressed(); }
          }
          EOF
      - name: Montar APK Android
        run: gradle -p android --no-daemon assembleDebug
      - name: Publicar APK para download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Gerente-de-Futebol.apk
          gh release delete android-v1 --yes --cleanup-tag || true
          gh release create android-v1 Gerente-de-Futebol.apk --target "$GITHUB_SHA" --title 'Gerente de Futebol para Android' --notes 'Primeira versão de testes para Android, em tela horizontal. APK assinado para testes; a carreira salva no navegador não é transferida automaticamente.' --latest
      - uses: actions/upload-artifact@v4
        with:
          name: Gerente-de-Futebol-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
