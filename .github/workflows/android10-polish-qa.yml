          cl('#createCareerBtn')
          for s in ['#cwCountryNext','#cwDivisionNext','#start']:cl(s)
          wait("!document.querySelector('#app').classList.contains('hidden')",'synthetic career starts')
          ck("JSON.parse(localStorage.getItem('gdf-career-slots-v1')||'[]').length===1",'only one synthetic save')
          for n,s,m in [('Base de jovens','[data-youth-sign]','.m11-academy-shell'),('Departamento médico','[data-med-rest]','.m11-academy-shell'),('Olheiros','[data-network-watch]','.m11-academy-shell'),('Finanças','.gm-shell','.gm-ledger'),('Diretoria','.gm-shell','.gm-goal'),('Desenvolvimento individual','.gm-shell','#gmIndividualFocus')]:
              tab(n);ck('!!document.querySelector('+json.dumps(m)+')','new screen '+n)
              if s.startswith('['):cl(s)
          tab('Treino');cl('#openTrainingStudio');ck("document.querySelectorAll('#trainingLineup .training-player').length===11",'training lineup')
          cl('[data-player-pick="attack"]');cl('[data-select-player]')
          for day in range(3):
              if not js("document.querySelector('#trainingStudio')"):cl('#openTrainingStudio')
              cl('#runTraining');wait("document.querySelector('#runTraining').textContent.indexOf('concluído')>=0",'training session completes')
              cl('#closeTraining')
              if day<2:tab('Visão geral');cl('#advanceCareerDay');tab('Treino')
          tab('Visão geral');cl('#advanceCareerDay');wait('window.__slotQA.state().matchTrainingDays>=3&&window.__slotQA.state().trainingDay!==window.__slotQA.state().calendarDay','training unlocks game')
