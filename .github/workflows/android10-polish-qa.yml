          def cl(s):ck('!!document.querySelector('+json.dumps(s)+')','control '+s);js('document.querySelector('+json.dumps(s)+').click()');time.sleep(.4)
          def tab(n):
              if js("!document.querySelector('#nav').classList.contains('open')"):cl('#menuToggle')
