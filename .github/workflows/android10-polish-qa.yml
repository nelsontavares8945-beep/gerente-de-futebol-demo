name: Android 10 — Mestre 11 isolated polish QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android10:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
name: Android 10 — Mestre 11 splash isolated QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android10:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact splash candidate on isolated branch
        run: |
          set -eu
          test "$(sha256sum mestre11-tela-inicial-candidata.html | cut -d' ' -f1)" = d18729a90ce7508ac1e17e64868dff8393832bf7ca519eace0aca25e9dcf0298
          mkdir -p android/app/src/main/assets android/app/src/main/java/br/com/gerentefutebol android/app/src/main/res/drawable scratch
          cp mestre11-tela-inicial-candidata.html android/app/src/main/assets/index.html
          cp icon-192.png android/app/src/main/res/drawable/icon.png
          echo 'candidate=d18729a90ce7508ac1e17e64868dff8393832bf7ca519eace0aca25e9dcf0298' > scratch/provenance.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Chrome 75 inline JS transpile
        run: |
          npm install --no-save esbuild@0.25.0
          python3 - <<'PY'
          import re,pathlib,subprocess,tempfile,hashlib
          p=pathlib.Path('android/app/src/main/assets/index.html'); h=p.read_text(); n=0
          def f(m):
              global n
              if not m.group(2).strip() or re.search(r'\bsrc\s*=',m.group(1),re.I): return m.group(0)
              with tempfile.TemporaryDirectory() as d:
                  a=pathlib.Path(d)/'a.js'; b=pathlib.Path(d)/'b.js'; a.write_text(m.group(2))
                  subprocess.run(['npx','--no-install','esbuild',str(a),'--target=chrome75','--outfile='+str(b)],check=True,stdout=subprocess.DEVNULL); out=b.read_text()
              n+=1; return m.group(1)+out+m.group(3)
          h=re.sub(r'(<script\b[^>]*>)(.*?)(</script\s*>)',f,h,flags=re.I|re.S); assert n>=2,n; p.write_text(h)
          pathlib.Path('scratch/transpiled.sha256').write_text(hashlib.sha256(h.encode()).hexdigest()+'\n'); print('Chrome 75 inline JS transpile:',n)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build isolated debug app, artifact only
        run: |
          set -eu
          cat > android/settings.gradle <<'GRADLE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='M11QA'; include ':app'
          GRADLE
          echo "plugins { id 'com.android.application' version '8.6.1' apply false }" > android/build.gradle
          cat > android/app/build.gradle <<'GRADLE'
          plugins { id 'com.android.application' }
          android { namespace 'br.com.gerentefutebol'; compileSdk 35; defaultConfig { applicationId 'br.com.gerentefutebol.splashqa'; minSdk 23; targetSdk 28; versionCode 63; versionName 'android10-qa' } }
          GRADLE
          cat > android/app/src/main/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:label="Mestre 11 QA" android:icon="@drawable/icon" android:theme="@android:style/Theme.Material.NoActionBar" android:hardwareAccelerated="true" android:allowBackup="false"><activity android:name="br.com.gerentefutebol.MainActivity" android:exported="true" android:screenOrientation="landscape"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          XML
          cat > android/app/src/main/java/br/com/gerentefutebol/MainActivity.java <<'JAVA'
          package br.com.gerentefutebol;
          import android.app.*;import android.os.*;import android.webkit.*;import android.view.*;
          public class MainActivity extends Activity { public void onCreate(Bundle b){super.onCreate(b);getWindow().getDecorView().setSystemUiVisibility(5894);WebView w=new WebView(this);w.getSettings().setJavaScriptEnabled(true);w.getSettings().setDomStorageEnabled(true);w.setLayerType(View.LAYER_TYPE_HARDWARE,null);WebView.setWebContentsDebuggingEnabled(true);w.setWebChromeClient(new WebChromeClient(){public boolean onConsoleMessage(ConsoleMessage m){android.util.Log.i("M11QA",m.message());return true;}});w.setWebViewClient(new WebViewClient(){public WebResourceResponse shouldInterceptRequest(WebView v,WebResourceRequest r){if("game.gerentefutebol.local".equals(r.getUrl().getHost()))try{return new WebResourceResponse("text/html","UTF-8",getAssets().open("index.html"));}catch(Exception e){}return super.shouldInterceptRequest(v,r);}});setContentView(w);w.loadUrl("https://game.gerentefutebol.local/index.html?qaSlots");} }
          JAVA
          gradle -p android --no-daemon assembleDebug
          apk=android/app/build/outputs/apk/debug/app-debug.apk; test -s "$apk"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$apk" | grep -F "br.com.gerentefutebol.splashqa"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify "$apk"; sha256sum "$apk" > scratch/apk.sha256
      - run: python3 -m pip install -q websocket-client
      - name: Prepare emulator interaction smoke
        run: |
          cat > smoke.py <<'PY'
          import json,time,itertools,urllib.request,websocket
          p=next(x for x in json.load(urllib.request.urlopen('http://localhost:9222/json')) if x.get('type')=='page')
          w=websocket.create_connection(p['webSocketDebuggerUrl'],timeout=45,suppress_origin=True); seq=itertools.count(1)
          def js(e):
              i=next(seq); w.send(json.dumps({'id':i,'method':'Runtime.evaluate','params':{'expression':e,'returnByValue':True}}))
              while True:
                  r=json.loads(w.recv())
                  if r.get('id')==i:
                      if r.get('result',{}).get('exceptionDetails'): raise Exception(r['result']['exceptionDetails'])
                      return r['result']['result'].get('value')
          def ck(e,n):
              v=js(e); print(('PASS' if v else 'FAIL'),n,flush=True)
              if not v: raise AssertionError(n)
          def wait(e,n):
              for _ in range(100):
                  if js(e): print('PASS',n,flush=True); return
                  time.sleep(.4)
              raise AssertionError(n)
          def cl(s):
              ck('!!document.querySelector('+json.dumps(s)+')','control '+s)
              js('document.querySelector('+json.dumps(s)+').click()'); time.sleep(.5)
          wait("document.querySelector('#moOpening') && !document.querySelector('#moOpening').hidden",'splash is visible at first launch')
          ck("document.querySelector('#moSplash img.m11-entry-bg') && document.querySelector('#moSplash img.m11-entry-bg').naturalWidth>0",'splash image loaded')
          cl('#m11Continue')
          wait("document.querySelector('#moOpening').hidden && !document.querySelector('#careerHome').classList.contains('hidden')",'CTA opens career home')
          cl('#createCareerBtn')
          wait("!!document.querySelector('#cwCountryNext')",'new career wizard opens')
          cl('#cwCountryNext'); cl('#cwDivisionNext')
          ck("!!document.querySelector('#start') && !document.querySelector('#start').disabled",'default club is selected')
          cl('#start')
          wait("!document.querySelector('#app').classList.contains('hidden')",'new career starts and enters game')
          ck("JSON.parse(localStorage.getItem('gdf-career-slots-v1')||'[]').length===1",'one synthetic career save created')
          print('PASS Android 10 splash, CTA, wizard and career-start smoke',flush=True)
          PY
      - name: Enable KVM for emulator
        run: echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules && sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Android 10 emulator splash smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            bash -c 'set -e; adb install android/app/build/outputs/apk/debug/app-debug.apk; adb logcat -c; adb shell am start -W -n br.com.gerentefutebol.splashqa/br.com.gerentefutebol.MainActivity; sleep 18; adb forward tcp:9222 localabstract:webview_devtools_remote_$(adb shell pidof br.com.gerentefutebol.splashqa | tr -d "\r"); python3 smoke.py; adb shell screencap -p /sdcard/qa.png; adb pull /sdcard/qa.png scratch/android10.png; adb logcat -d -s AndroidRuntime:E M11QA:I chromium:E > scratch/logcat.txt; ! grep -E "FATAL EXCEPTION|Uncaught (SyntaxError|ReferenceError|TypeError)" scratch/logcat.txt'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mestre11-splash-android10-qa-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            scratch/*
            smoke.py
          retention-days: 7
          ref: 63afd4a8eb1f4210e2dc9818f5c928c5ff939312
          path: candidate
      - name: Verify exact candidate
        run: |
          set -eu
          test "$(git -C candidate rev-parse HEAD)" = 63afd4a8eb1f4210e2dc9818f5c928c5ff939312
          test "$(sha256sum candidate/mestre11-polish-qa.html | cut -d' ' -f1)" = d4e7836541150f8d2cd6b7fc80e8457aefa1c05bb40402e0739058dac70c53a2
          mkdir -p android/app/src/main/assets android/app/src/main/java/br/com/gerentefutebol android/app/src/main/res/drawable scratch
          cp candidate/mestre11-polish-qa.html android/app/src/main/assets/index.html
          cp candidate/icon-192.png android/app/src/main/res/drawable/icon.png
          echo 'candidate=63afd4a8eb1f4210e2dc9818f5c928c5ff939312 d4e7836541150f8d2cd6b7fc80e8457aefa1c05bb40402e0739058dac70c53a2' > scratch/provenance.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Chrome 75 inline JS transpile
        run: |
          npm install --no-save esbuild@0.25.0
          python3 - <<'PY'
          import re,pathlib,subprocess,tempfile,hashlib
          p=pathlib.Path('android/app/src/main/assets/index.html'); h=p.read_text(); n=0
          def f(m):
              global n
              if not m.group(2).strip() or re.search(r'\bsrc\s*=',m.group(1),re.I): return m.group(0)
              with tempfile.TemporaryDirectory() as d:
                  a=pathlib.Path(d)/'a.js'; b=pathlib.Path(d)/'b.js'; a.write_text(m.group(2))
                  subprocess.run(['npx','--no-install','esbuild',str(a),'--target=chrome75','--outfile='+str(b)],check=True,stdout=subprocess.DEVNULL); out=b.read_text()
              n+=1; return m.group(1)+out+m.group(3)
          h=re.sub(r'(<script\b[^>]*>)(.*?)(</script\s*>)',f,h,flags=re.I|re.S); assert n>=2,n; p.write_text(h)
          pathlib.Path('scratch/transpiled.sha256').write_text(hashlib.sha256(h.encode()).hexdigest()+'\n'); print('Chrome 75 inline JS transpile:',n)
          PY
      - uses: actions/setup-java@v4
