name: Android 10 - Mestre 11 redesign preview QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android10:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Prepare standalone app assets
        run: |
          set -eu
          mkdir -p android/app/src/main/assets android/app/src/main/java/br/com/gerentefutebol/redesignpreview android/app/src/main/res/drawable scratch
          cp mestre11-redesign-preview.html android/app/src/main/assets/index.html
          cp media/mestre11-icon-v2-192.png android/app/src/main/res/drawable/icon.png
          python3 - <<'PY'
          import pathlib,re
          p=pathlib.Path('android/app/src/main/assets/index.html'); h=p.read_text()
          h=h.replace('/mestre11-icon-192.png?v=2','mestre11-icon-192.png').replace('/gerente-de-futebol-demo/icon-192.png','mestre11-icon-192.png').replace('/gerente-de-futebol-demo/manifest.webmanifest','mestre11.webmanifest')
          h=re.sub(r'<link[^>]+rel=["\']manifest["\'][^>]*>', '', h, flags=re.I)
          start=h.find('<div id="moOpening"'); end=h.find('<header class="top"', start)
          if start>=0 and end>start: h=h[:start]+h[end:]
          h=re.sub(r'function mestreOnzeBoot\(\)\{.*?mestreOnzeBoot\(\);', '', h, flags=re.S)
          h=h.replace('</head>','<link rel="icon" href="mestre11-icon-192.png"></head>')
          p.write_text(h)
          pathlib.Path('android/app/src/main/assets/mestre11-icon-192.png').write_bytes(pathlib.Path('media/mestre11-icon-v2-192.png').read_bytes())
          PY
      - name: Transpile inline JavaScript for Android 10 WebView
        run: |
          npm install --no-save esbuild@0.25.0
          python3 - <<'PY'
          import re,pathlib,subprocess,tempfile,hashlib
          p=pathlib.Path('android/app/src/main/assets/index.html'); h=p.read_text(); n=0
          def f(m):
              global n
              if not m.group(2).strip() or re.search(r'\bsrc\s*=',m.group(1),re.I): return m.group(0)
              with tempfile.TemporaryDirectory() as d:
                  a=pathlib.Path(d)/'a.js'; b=pathlib.Path(d)/'b.js'; a.write_text(m.group(2))
                  subprocess.run(['npx','--no-install','esbuild',str(a),'--target=chrome75','--outfile='+str(b)],check=True,stdout=subprocess.DEVNULL); out=b.read_text()
              n+=1; return m.group(1)+out+m.group(3)
          h=re.sub(r'(<script\b[^>]*>)(.*?)(</script\s*>)',f,h,flags=re.I|re.S); assert n>=2,n; p.write_text(h)
          pathlib.Path('scratch/transpiled.sha256').write_text(hashlib.sha256(h.encode()).hexdigest()+'\n'); print('transpiled inline scripts:',n)
          PY
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - name: Build isolated debug APK
        run: |
          cat > android/settings.gradle <<'GRADLE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='Mestre11RedesignPreview'; include ':app'
          GRADLE
          echo "plugins { id 'com.android.application' version '8.6.1' apply false }" > android/build.gradle
          cat > android/app/build.gradle <<'GRADLE'
          plugins { id 'com.android.application' }
          android { namespace 'br.com.gerentefutebol.redesignpreview'; compileSdk 35; defaultConfig { applicationId 'br.com.gerentefutebol.redesignpreview'; minSdk 23; targetSdk 28; versionCode 1; versionName 'redesign-preview-1' } }
          GRADLE
          cat > android/app/src/main/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:label="Mestre 11 Prévia" android:icon="@drawable/icon" android:theme="@android:style/Theme.Material.NoActionBar" android:hardwareAccelerated="true" android:allowBackup="false"><activity android:name="br.com.gerentefutebol.redesignpreview.MainActivity" android:exported="true" android:screenOrientation="landscape"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          XML
          cat > android/app/src/main/java/br/com/gerentefutebol/redesignpreview/MainActivity.java <<'JAVA'
          package br.com.gerentefutebol.redesignpreview;
          import android.app.*;import android.os.*;import android.webkit.*;import android.view.*;import java.io.*;
          public class MainActivity extends Activity {
            public void onCreate(Bundle b){super.onCreate(b);getWindow().getDecorView().setSystemUiVisibility(5894);WebView w=new WebView(this);WebSettings s=w.getSettings();s.setJavaScriptEnabled(true);s.setDomStorageEnabled(true);s.setAllowFileAccess(true);s.setAllowContentAccess(false);s.setAllowFileAccessFromFileURLs(false);s.setAllowUniversalAccessFromFileURLs(false);s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);w.setLayerType(View.LAYER_TYPE_HARDWARE,null);WebView.setWebContentsDebuggingEnabled(true);w.setWebChromeClient(new WebChromeClient(){public boolean onConsoleMessage(ConsoleMessage m){android.util.Log.i("M11Preview",m.message()+" ["+m.lineNumber()+"]");return false;}});w.setWebViewClient(new WebViewClient(){public boolean shouldOverrideUrlLoading(WebView v,String u){return !(u.startsWith("file:///android_asset/")||u.startsWith("https://"));}public boolean shouldOverrideUrlLoading(WebView v,WebResourceRequest r){String u=r.getUrl().toString();return !(u.startsWith("file:///android_asset/")||u.startsWith("https://"));}});setContentView(w);w.loadUrl("file:///android_asset/index.html");}
          }
          JAVA
          gradle -p android --no-daemon assembleDebug
          apk=android/app/build/outputs/apk/debug/app-debug.apk; test -s "$apk"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$apk" | grep -F 'br.com.gerentefutebol.redesignpreview'
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$apk" | grep -F "Mestre 11 Prévia"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify "$apk"
          sha256sum "$apk" | tee scratch/apk.sha256
          unzip -p "$apk" assets/index.html | grep -qF 'Criar carreira'
      - run: python3 -m pip install -q websocket-client
      - name: Android 10 emulator QA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 smoke.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mestre11-redesign-preview-android10-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            scratch/*
            smoke.py
          retention-days: 7
