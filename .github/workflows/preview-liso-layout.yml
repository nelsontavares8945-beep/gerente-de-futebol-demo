name: Mestre 11 — desempenho fluido TESTE
run-name: Mestre 11 fluido ${{ github.run_number }}
on:
  workflow_dispatch:
  push:
    branches:
      - gdf-apk-safe-test-f2a2f5a
    paths:
      - 'mestre11-liso-layout.html'
      - '.github/workflows/preview-liso-layout.yml'
      - 'assets/**'
      - 'smoke-liso.py'
permissions:
  contents: write
jobs:
  test-apk:
    if: github.ref == 'refs/heads/gdf-apk-safe-test-f2a2f5a'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare backwards-compatible HTML bundle
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save esbuild@0.25.0
          python3 - <<'PY'
          import pathlib, re, subprocess, tempfile
          p=pathlib.Path('mestre11-liso-layout.html')
          html=p.read_text(encoding='utf-8')
          assert '</style>\n<style id="mestre-onze-css">' in html, 'Opening CSS must be a standalone stylesheet' 
          # Transpile inline JS for the Android 10 WebView (Chrome 75), which predates some modern syntax.
          pattern=re.compile(r'(<script\b[^>]*>)(.*?)(</script\s*>)',re.I|re.S)
          def transpile(m):
              code=m.group(2)
              if not code.strip() or 'src=' in m.group(1).lower(): return m.group(0)
              with tempfile.NamedTemporaryFile('w',suffix='.js',encoding='utf-8',delete=False) as f:
                  f.write(code); src=pathlib.Path(f.name)
              out=src.with_suffix('.out.js')
              subprocess.run(['npx','esbuild',str(src),'--target=chrome75','--outfile='+str(out)],check=True,stdout=subprocess.DEVNULL)
              result=out.read_text(encoding='utf-8')
              src.unlink();out.unlink()
              return m.group(1)+result+m.group(3)
          html=pattern.sub(transpile,html)
          p.write_text(html,encoding='utf-8')
          print('Prepared compatibility bundle; inline scripts transpiled to Chrome 75.')
          PY
      - name: Build isolated Android TEST app
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/java/br/com/gerentefutebol android/app/src/main/assets/assets android/app/src/main/res/drawable
          cp mestre11-liso-layout.html android/app/src/main/assets/index.html
          cp icon-192.png android/app/src/main/res/drawable/icon.png
          cp assets/menu-mestre-11.png android/app/src/main/assets/assets/
          rm -f android/app/src/main/assets/assets/tela-carregamento-mestre-11.png android/app/src/main/assets/assets/splash-mestre-11.webp
          test -s android/app/src/main/assets/assets/menu-mestre-11.png
          cat > android/settings.gradle <<'GRADLE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='Mestre11Test'; include ':app'
          GRADLE
          cat > android/build.gradle <<'GRADLE'
          plugins { id 'com.android.application' version '8.6.1' apply false }
          GRADLE
          cat > android/app/build.gradle <<'GRADLE'
          plugins { id 'com.android.application' }
          android { namespace 'br.com.gerentefutebol'; compileSdk 35
            defaultConfig { applicationId 'br.com.gerentefutebol.supertest'; minSdk 23; targetSdk 28; versionCode 3; versionName "mestre-11-test-${System.getenv('GITHUB_RUN_NUMBER')}" }
          }
          GRADLE
          cat > android/app/src/main/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:label="Mestre 11 TESTE" android:icon="@drawable/icon" android:theme="@android:style/Theme.Material.NoActionBar" android:hardwareAccelerated="false" android:usesCleartextTraffic="false" android:allowBackup="true">
              <activity android:name="br.com.gerentefutebol.MainActivity" android:exported="true" android:screenOrientation="landscape" android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
              </activity>
            </application>
          </manifest>
          XML
          cat > android/app/src/main/java/br/com/gerentefutebol/MainActivity.java <<'JAVA'
          package br.com.gerentefutebol;
          import android.app.Activity; import android.os.Bundle; import android.view.View; import android.webkit.*; import android.content.Intent; import android.net.Uri; import java.io.IOException;
          public class MainActivity extends Activity {
            private static final int FILE_CHOOSER_REQUEST=101;
            private ValueCallback<Uri[]> filePathCallback;
            private WebView game;
            @Override public void onCreate(Bundle state){super.onCreate(state);
              getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_FULLSCREEN|View.SYSTEM_UI_FLAG_HIDE_NAVIGATION|View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY|View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN|View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION|View.SYSTEM_UI_FLAG_LAYOUT_STABLE);
              game=new WebView(this);game.setLayerType(View.LAYER_TYPE_SOFTWARE,null);game.getSettings().setJavaScriptEnabled(true);game.getSettings().setDomStorageEnabled(true);game.getSettings().setMediaPlaybackRequiresUserGesture(false);
              WebView.setWebContentsDebuggingEnabled(true);
              game.setWebChromeClient(new WebChromeClient(){@Override public boolean onConsoleMessage(ConsoleMessage message){android.util.Log.i("GDFWeb",message.message());return true;} @Override public boolean onShowFileChooser(WebView view,ValueCallback<Uri[]> callback,FileChooserParams params){if(filePathCallback!=null)filePathCallback.onReceiveValue(null);filePathCallback=callback;try{startActivityForResult(params.createIntent(),FILE_CHOOSER_REQUEST);return true;}catch(Exception e){filePathCallback=null;return false;}}});
              game.setWebViewClient(new WebViewClient(){@Override public WebResourceResponse shouldInterceptRequest(WebView view,WebResourceRequest request){if("https".equals(request.getUrl().getScheme())&&"game.gerentefutebol.local".equals(request.getUrl().getHost())){String path=request.getUrl().getPath();if(path==null||path.equals("/")||path.equals("/index.html"))try{return new WebResourceResponse("text/html","UTF-8",getAssets().open("index.html"));}catch(IOException e){return null;}if(path.startsWith("/assets/"))try{String name=path.substring(1);String mime=name.endsWith(".png")?"image/png":name.endsWith(".webp")?"image/webp":"application/octet-stream";return new WebResourceResponse(mime,null,getAssets().open(name));}catch(IOException e){return new WebResourceResponse("text/plain","UTF-8",200,"Not Found",null,new java.io.ByteArrayInputStream(new byte[0]));}}return super.shouldInterceptRequest(view,request);}@Override public void onPageFinished(WebView view,String url){view.evaluateJavascript("(function(){var b=document.getElementById('installApp');if(b)b.style.display='none';})()",null);}});
              setContentView(game);if(state!=null){if(game.restoreState(state)==null)game.loadUrl("https://game.gerentefutebol.local/index.html");}else game.loadUrl("https://game.gerentefutebol.local/index.html");
            }
            @Override protected void onActivityResult(int requestCode,int resultCode,Intent data){if(requestCode==FILE_CHOOSER_REQUEST){ValueCallback<Uri[]> callback=filePathCallback;filePathCallback=null;if(callback!=null)callback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode,data));return;}super.onActivityResult(requestCode,resultCode,data);}
            @Override public void onSaveInstanceState(Bundle out){super.onSaveInstanceState(out);if(game!=null)game.saveState(out);}
            @Override public void onBackPressed(){if(game!=null&&game.canGoBack())game.goBack();else super.onBackPressed();}
          }
          JAVA
          gradle -p android --no-daemon assembleDebug
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          cp "$apk" Mestre-11-TESTE.apk
          sha256sum Mestre-11-TESTE.apk > SHA256SUMS.txt
          sha256sum android/app/src/main/assets/index.html android/app/src/main/assets/assets/* >> SHA256SUMS.txt
      - name: Enable virtualisation for Android emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify APK opens on isolated Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r Mestre-11-TESTE.apk
            adb logcat -c
            adb shell am start -W -n br.com.gerentefutebol.supertest/br.com.gerentefutebol.MainActivity
            sleep 15
            adb shell pidof br.com.gerentefutebol.supertest
            adb shell dumpsys activity activities | grep -F 'br.com.gerentefutebol.MainActivity'
            adb forward tcp:9222 localabstract:webview_devtools_remote_$(adb shell pidof br.com.gerentefutebol.supertest | tr -d '\r')
            python3 -m pip install -q websocket-client
            python3 smoke-liso.py
            adb logcat -d -s AndroidRuntime:E GDFWeb:I chromium:E > android-runtime.log
            if grep -E 'FATAL EXCEPTION|Uncaught (SyntaxError|ReferenceError|TypeError)|Uncaught SyntaxError|Uncaught ReferenceError|Uncaught TypeError' android-runtime.log; then exit 1; fi
      - name: Publish isolated test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create mestre-11-fluido-run-${GITHUB_RUN_NUMBER} Mestre-11-TESTE.apk SHA256SUMS.txt --target "$GITHUB_SHA" --title 'Mestre 11 — correção de fluidez (TESTE)' --notes 'Corrige o gargalo na camada de acessibilidade que varria repetidamente todo o DOM durante atualizações; agora só processa conteúdo novo. Reduz efeitos de pintura e sombras pesadas, mantendo o layout de partida aprovado, rolagem, botões e o radar funcional. As telas/fotos antigas de carregamento continuam removidas do bundle. Smoke test e emulador aprovados; o desempenho em celular físico ainda precisa ser confirmado. Exporte as carreiras em Centro do clube > Backup antes de atualizar.' --prerelease --latest=false
      - uses: actions/upload-artifact@v4
        with:
          name: Mestre-11-TESTE-${{ github.run_number }}
          path: Mestre-11-TESTE.apk
          if-no-files-found: error
          retention-days: 14
