name: Android APK — Mestre 11 GPU + cadeado (safe)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout verified candidate only
        uses: actions/checkout@v4
        with:
          ref: feature-slot-assignment-2026-11-15
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Generate Android app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/java/br/com/gerentefutebol/gpulocktest android/app/src/main/assets android/app/src/main/res/drawable
          cp mestre11-cadeado.html android/app/src/main/assets/mestre11-cadeado.html
          cp icon-192.png android/app/src/main/res/drawable/icon.png
          cp assets/menu-mestre-11.png android/app/src/main/assets/menu-mestre-11.png
          cat > android/settings.gradle <<'GRADLE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'Mestre11GpuLock'
          include ':app'
          GRADLE
          echo "plugins { id 'com.android.application' version '8.6.1' apply false }" > android/build.gradle
          cat > android/app/build.gradle <<'GRADLE'
          plugins { id 'com.android.application' }
          android { namespace 'br.com.gerentefutebol.gpulocktest'; compileSdk 35
            defaultConfig { applicationId 'br.com.gerentefutebol.gpulocktest'; minSdk 23; targetSdk 28; versionCode 5; versionName '1.0-slot-assignment-candidate' }
          }
          GRADLE
          cat > android/app/src/main/AndroidManifest.xml <<'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:label="Mestre 11 GPU + Cadeado" android:icon="@drawable/icon" android:theme="@android:style/Theme.Material.NoActionBar" android:usesCleartextTraffic="false" android:allowBackup="true" android:hardwareAccelerated="true"><activity android:name=".MainActivity" android:exported="true" android:screenOrientation="landscape" android:configChanges="orientation|screenSize|keyboardHidden"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          MANIFEST
          cat > android/app/src/main/java/br/com/gerentefutebol/gpulocktest/MainActivity.java <<'JAVA'
          package br.com.gerentefutebol.gpulocktest;
          import android.app.Activity; import android.os.Bundle; import android.view.View; import android.webkit.*; import java.io.IOException;
          public class MainActivity extends Activity {
            WebView game;
            int immersive(){return View.SYSTEM_UI_FLAG_FULLSCREEN|View.SYSTEM_UI_FLAG_HIDE_NAVIGATION|View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY|View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN|View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION|View.SYSTEM_UI_FLAG_LAYOUT_STABLE;}
            class AndroidNavControl {@JavascriptInterface public void setLocked(final boolean locked){runOnUiThread(()->getWindow().getDecorView().setSystemUiVisibility(locked?immersive():View.SYSTEM_UI_FLAG_LAYOUT_STABLE));}}
            @Override public void onCreate(Bundle state){super.onCreate(state);getWindow().getDecorView().setSystemUiVisibility(immersive());game=new WebView(this);game.setLayerType(View.LAYER_TYPE_HARDWARE,null);game.getSettings().setJavaScriptEnabled(true);game.getSettings().setDomStorageEnabled(true);game.getSettings().setMediaPlaybackRequiresUserGesture(false);game.addJavascriptInterface(new AndroidNavControl(),"AndroidNavControl");game.setWebChromeClient(new WebChromeClient());game.setWebViewClient(new WebViewClient(){@Override public WebResourceResponse shouldInterceptRequest(WebView v,WebResourceRequest r){String p=r.getUrl().getPath();try{if("/index.html".equals(p)||"/".equals(p))return new WebResourceResponse("text/html","UTF-8",getAssets().open("mestre11-cadeado.html"));if(p!=null&&p.endsWith("/icon-192.png"))return new WebResourceResponse("image/png",null,getAssets().open("icon.png"));if(p!=null&&p.endsWith("/menu-mestre-11.png"))return new WebResourceResponse("image/png",null,getAssets().open("menu-mestre-11.png"));}catch(IOException e){return new WebResourceResponse("text/plain","UTF-8",null);}return super.shouldInterceptRequest(v,r);}@Override public void onPageFinished(WebView v,String u){v.evaluateJavascript("(function(){var b=document.getElementById('installApp');if(b)b.style.display='none';})()",null);}});setContentView(game);if(state!=null)game.restoreState(state);else game.loadUrl("https://game.gerentefutebol.local/index.html");}
            @Override public void onSaveInstanceState(Bundle out){super.onSaveInstanceState(out);game.saveState(out);}
            @Override public void onBackPressed(){if(game.canGoBack())game.goBack();else super.onBackPressed();}
          }
          JAVA
      - name: Assemble APK
        run: gradle -p android --no-daemon assembleDebug
      - name: Verify application ID and Android Debug signature
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='br.com.gerentefutebol.gpulocktest' versionCode='5'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
      - name: Android API 29 emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          script: |
            set -euo pipefail
            APK=android/app/build/outputs/apk/debug/app-debug.apk
            adb install "$APK"
            adb shell monkey -p br.com.gerentefutebol.gpulocktest 1
            sleep 20
            adb shell dumpsys activity activities | grep -F 'br.com.gerentefutebol.gpulocktest/.MainActivity'
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml window.xml >/dev/null
            grep -Eq 'Criar carreira|Carreiras salvas' window.xml
      - uses: actions/upload-artifact@v4
        with:
          name: Mestre11-GPU-Cadeado-AndroidDebug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
