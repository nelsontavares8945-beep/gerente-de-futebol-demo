<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10241c"><title>Gerente de Futebol — Carreira</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#eff8ef;background:#0c1712;--panel:#172a20;--panel2:#20382a;--green:#baf477;--muted:#a9bdad;--line:#345140;--red:#ff8b80;--gold:#f7cd67}*{box-sizing:border-box}body{margin:0}.top{position:sticky;top:0;background:#0c1712ed;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:4;padding:10px max(calc((100vw - 1100px)/2),16px);display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:900;color:var(--green);font-size:1.15rem}.muted,small{color:var(--muted)}.wrap{max-width:1100px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:var(--panel);border:1px solid #294334;border-radius:14px;padding:14px;margin-bottom:12px}.stat{font-size:1.35rem;font-weight:800;margin:4px 0}.flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.nav{display:flex;overflow:auto;gap:7px;padding:8px 0 14px;position:sticky;top:54px;background:#0c1712;z-index:3}.nav button,.btn{white-space:nowrap;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:#eff8ef;padding:9px 12px;font-weight:700;cursor:pointer}.nav button.active,.btn.primary{background:var(--green);color:#14221a;border-color:var(--green)}button:disabled{opacity:.4;cursor:default}select,input{border:1px solid var(--line);background:#102219;color:#eff8ef;border-radius:8px;padding:9px}h1,h2,h3{margin:4px 0 12px}p{line-height:1.5}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #2c4635}th{color:var(--muted);font-size:.86rem}.scroll{overflow:auto}.pill{padding:4px 8px;background:#284333;border-radius:999px;font-size:.8rem}.green{color:var(--green)}.gold{color:var(--gold)}.red{color:var(--red)}.notice{background:#382f19;border-left:3px solid var(--gold);padding:10px;border-radius:5px;color:#f5e7bf}.pitch{position:relative;overflow:hidden;background:repeating-linear-gradient(0deg,#1b623f,#1b623f 42px,#1c6943 42px,#1c6943 84px);border:4px solid #c6dfb7;border-radius:12px;aspect-ratio:1.7/1;max-height:410px}.pitch:before{content:'';position:absolute;inset:0 50%;border-left:2px solid #d2e8c9}.pitch:after{content:'';position:absolute;left:50%;top:50%;width:80px;height:80px;border:2px solid #d2e8c9;border-radius:50%;transform:translate(-50%,-50%)}.boxline{position:absolute;top:24%;bottom:24%;width:12%;border:2px solid #d2e8c9}.boxline.left{left:-2px;border-left:0}.boxline.right{right:-2px;border-right:0}.dot{position:absolute;z-index:1;width:13px;height:13px;border:2px solid white;border-radius:50%;background:#52a9ff;box-shadow:0 1px 5px #111;transition:left .8s ease,top .8s ease}.dot.redteam{background:#ff675e}.ball{position:absolute;z-index:2;width:10px;height:10px;background:white;border:2px solid #162019;border-radius:50%;transition:all .7s ease;box-shadow:0 0 8px white}.log{max-height:160px;overflow:auto;line-height:1.65}.hidden{display:none!important}.meter{height:8px;background:#34453a;border-radius:9px;overflow:hidden}.meter i{height:100%;display:block;background:var(--green)}.smallbtn{font-size:.8rem;padding:5px 8px}.setup{max-width:600px;margin:40px auto}.toast{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#294334;padding:12px;border-radius:10px;z-index:8}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.top{padding:10px 14px}.wrap{padding:12px}.nav{top:50px}.stat{font-size:1.15rem}th,td{padding:7px 4px;font-size:.9rem}}
</style></head><body><header class="top"><div><div class="brand">⚽ GERENTE DE FUTEBOL</div><small id="topclub">Sua carreira começa aqui</small></div><div class="flex"><div id="topmeta" class="muted"></div><button id="restart" class="btn smallbtn hidden">Nova carreira</button></div></header><main class="wrap"><section id="setup" class="card setup"><h1>Comece sua carreira</h1><p>Escolha um clube da Série A 2026 e assuma o comando.</p><label>Clube<br><select id="pickclub"></select></label><p class="muted">Elencos de demonstração são fictícios; clubes são reais. Modo carreira salvo neste navegador.</p><button id="start" class="btn primary">Assumir o time</button></section><section id="app" class="hidden"><div id="summary" class="grid"></div><nav class="nav" id="nav"></nav><section id="view"></section></section></main><div id="toast" class="toast hidden"></div><script>
(()=>{'use strict';
const clubs=['Flamengo','Palmeiras','Cruzeiro','Mirassol','Fluminense','Bahia','Botafogo','São Paulo','Red Bull Bragantino','Corinthians','Grêmio','Vasco','Atlético-MG','Santos','Vitória','Internacional','Coritiba','Athletico-PR','Chapecoense','Remo'];
const libTeams=['Flamengo','Palmeiras','Cruzeiro','Mirassol','Fluminense','Corinthians','Bahia','Botafogo'];
const positions=['GOL','LD','ZAG','ZAG','LE','VOL','MC','MEI','PD','ATA','PE'];
const first=['Davi','Caio','Rafael','Luan','Pedro','João','Matheus','Nicolas','Gabriel','Enzo','Bruno','André','Lucas','Igor','Thiago','Vitor','Murilo','Arthur','Renan','Felipe'];
const last=['Alves','Costa','Silva','Moura','Ribeiro','Lima','Santos','Barbosa','Nogueira','Pereira','Rocha','Mendes','Ferreira','Azevedo','Oliveira','Carvalho','Martins','Teixeira','Dias','Souza'];
const navItems=['Visão geral','Elenco','Treino','Táticas','Calendário','Competições','Mercado'];let S=null;
const $=id=>document.getElementById(id), enc=encodeURIComponent;const read=()=>{try{S=JSON.parse(localStorage.getItem('gdf-career-v2'))}catch(e){S=null}};const save=()=>{localStorage.setItem('gdf-career-v2',JSON.stringify(S));render()};const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function makeSquad(){return positions.map((pos,i)=>({name:first[(i*3+rnd(0,19))%20]+' '+last[(i*7+rnd(0,19))%20],pos,rating:rnd(62,82),energy:rnd(78,100),morale:rnd(65,90),age:rnd(18,32),starter:true}))}
function startCareer(){let club=$('pickclub').value;S={club,week:1,year:2026,points:0,wins:0,draws:0,losses:0,money:35,morale:75,fitness:82,formation:'4-3-3',mentality:'Equilibrado',training:'',lastMatch:null,played:{},squad:makeSquad(),log:['Você assumiu o comando do '+club+'. Boa sorte na temporada!'],league:clubs.map(c=>({club:c,pts:0,p:0,w:0,d:0,l:0,gf:0,ga:0})),lib:libTeams.includes(club)?{pts:0,p:0,w:0,d:0,l:0,gf:0,ga:0,group:['River Plate','Peñarol','Colo-Colo'],history:[]}:null};S.league.find(x=>x.club===club).pts=0;save();}
function statCards(){return [['Rodada',S.week+'/38'],['Pontos',S.points],['Orçamento','$'+S.money+' mi'],['Moral',S.morale+'%'],['Condição física',S.fitness+'%']]}
function frame(){ $('topclub').textContent=S.club+' • Temporada '+S.year;$('topmeta').textContent='Rodada '+S.week+' / 38';$('summary').innerHTML=statCards().map(x=>`<article class="card"><small>${x[0]}</small><div class="stat">${x[1]}</div></article>`).join('');$('setup').classList.add('hidden');$('app').classList.remove('hidden');$('restart').classList.remove('hidden');let tab=navItems.find(n=>n===window.currentTab)||'Visão geral';$('nav').innerHTML=navItems.map(n=>`<button class="${tab===n?'active':''}" data-tab="${n}">${n}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{window.currentTab=b.dataset.tab;render()});renderView(tab)}
function render(){if(!S){$('setup').classList.remove('hidden');$('app').classList.add('hidden');return}frame()}
function panel(title,body){return `<article class="card"><h2>${title}</h2>${body}</article>`}
function schedule(round){let arr=[...clubs];for(let n=1;n<((round-1)%19)+1;n++)arr=[arr[0],arr[arr.length-1],...arr.slice(1,-1)];let fixtures=[];for(let i=0;i<10;i++){let h=arr[i],away=arr[19-i];if(round>19)[h,away]=[away,h];fixtures.push([h,away])}return fixtures}
function score(avg){let n=0;for(let i=0;i<6;i++)if(Math.random()<avg/6)n++;return n}
function updateRow(name,gf,ga){let row=S.league.find(x=>x.club===name);row.p++;row.gf+=gf;row.ga+=ga;if(gf>ga){row.w++;row.pts+=3}else if(gf===ga){row.d++;row.pts++}else row.l++}
function nextGame(){if(S.week>38)return;let matches=schedule(S.week),mine=matches.find(x=>x.includes(S.club)),opponent=mine.find(x=>x!==S.club);let attack=S.squad.filter(x=>x.starter&&['ATA','PE','PD','MEI'].includes(x.pos)).reduce((a,b)=>a+b.rating,0)/4+(S.formation==='4-3-3'?4:0)+(S.mentality==='Ofensivo'?5:S.mentality==='Defensivo'?-3:0);let def=S.squad.filter(x=>x.starter&&['GOL','LD','ZAG','LE','VOL'].includes(x.pos)).reduce((a,b)=>a+b.rating,0)/6+(S.formation==='3-5-2'?3:0)+(S.mentality==='Defensivo'?6:0);let energy=S.squad.filter(p=>p.starter).reduce((a,b)=>a+b.energy,0)/11;let xg=Math.max(.35,Math.min(3.5,1.25+(attack-75)/18+(energy-75)/60));let og=Math.max(.25,Math.min(3,1.1+(74-def)/19+(S.mentality==='Ofensivo'?.25:0)));let gf=score(xg),ga=score(og);matches.forEach(([home,away])=>{let h,a;if(home===S.club){h=gf;a=ga}else if(away===S.club){h=ga;a=gf}else{h=score(1.5);a=score(1.15)}updateRow(home,h,a);updateRow(away,a,h)});let report={opponent,gf,ga,round:S.week,competition:'Brasileirão',home:mine[0]===S.club};S.money+=gf>ga?4:gf===ga?1:0;S.morale=Math.min(98,Math.max(45,S.morale+(gf>ga?7:gf===ga?1:-7)));S.squad.forEach(x=>x.energy=Math.max(35,Math.min(100,x.energy-rnd(8,16))));S.fitness=Math.round(S.squad.reduce((a,x)=>a+x.energy,0)/S.squad.length);if(gf>ga){S.wins++;S.points+=3}else if(gf===ga){S.draws++;S.points++}else S.losses++;if(S.lib&&S.week%3===0&&S.lib.p<6){let lr=S.lib,other=lr.group[lr.p%3],lg=score(xg),la=score(og);lr.p++;lr.gf+=lg;lr.ga+=la;if(lg>la){lr.w++;lr.pts+=3}else if(lg===la){lr.d++;lr.pts++}else lr.l++;lr.history.unshift(S.club+' '+lg+' × '+la+' '+other);S.log.unshift('Libertadores (simulação separada): '+lr.history[0]+'.')}S.lastMatch=report;S.log.unshift(`Rodada ${S.week}: ${S.club} ${gf} x ${ga} ${opponent} — ${gf>ga?'Vitória':gf===ga?'Empate':'Derrota'}.`);S.log=S.log.slice(0,30);S.week++;S.training='';save();window.currentTab='Visão geral';render();playRadar(report)}
function playRadar(m){let pitch=$('pitch');if(!pitch)return;let dots=[...pitch.querySelectorAll('.dot')],ball=pitch.querySelector('.ball'),feed=$('livefeed'),play=$('play'),heading=pitch.parentElement.querySelector('h3'),subtitle=pitch.parentElement.querySelector('p');if(play)play.disabled=true;if(heading)heading.textContent=S.club+' × '+m.opponent+' — partida em andamento';if(subtitle)subtitle.textContent='Radar tático • simulação';pitch.scrollIntoView({behavior:'smooth',block:'center'});let total=m.gf+m.ga;let goals=[];for(let i=0;i<m.gf;i++)goals.push('Gol de '+S.club+'!');for(let i=0;i<m.ga;i++)goals.push('Gol de '+m.opponent+'!');let seq=['Construção desde a defesa','Passe pelo meio','Disputa pela bola',...goals,'Pressão alta','Finalização para fora','Apito final'];let i=0;let timer=setInterval(()=>{if(i>=seq.length||!pitch.isConnected){clearInterval(timer);if(play)play.disabled=false;if(heading)heading.textContent=S.club+' '+m.gf+' × '+m.ga+' '+m.opponent;if(subtitle)subtitle.textContent='Brasileirão • apito final';return}let x=rnd(22,77),y=rnd(12,85);ball.style.left=x+'%';ball.style.top=y+'%';for(let n=0;n<dots.length;n++){let d=dots[n];d.style.left=Math.max(3,Math.min(95,(n<11?x-15:x+8)+rnd(-18,18)))+'%';d.style.top=Math.max(3,Math.min(94,y+rnd(-30,30)))+'%'}feed.textContent=(i===seq.length-1?'90′':Math.round((i+1)*90/seq.length)+'′')+' '+seq[i];i++},850)}
function standings(){let rows=[...S.league].sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf);return `<div class="scroll"><table><thead><tr><th>#</th><th>Clube</th><th>P</th><th>J</th><th>V</th><th>E</th><th>D</th><th>SG</th></tr></thead><tbody>${rows.map((r,i)=>`<tr ${r.club===S.club?'class="green"':''}><td>${i+1}</td><td>${esc(r.club)}</td><td>${r.pts}</td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gf-r.ga}</td></tr>`).join('')}</tbody></table></div>`}
function radar(){return `<div class="pitch" id="pitch"><i class="boxline left"></i><i class="boxline right"></i>${Array.from({length:22},(_,i)=>`<i class="dot ${i>=11?'redteam':''}" style="left:${i<11?10+(i%4)*7:55+(i%4)*7}%;top:${10+(i%6)*14}%"></i>`).join('')}<i class="ball" style="left:50%;top:50%"></i></div><p id="livefeed" class="log">${esc(S.lastMatch?`Apito final: ${S.club} ${S.lastMatch.gf} × ${S.lastMatch.ga} ${S.lastMatch.opponent}`:'O radar anima durante a simulação da partida.')}</p>`}
function overview(){let last=S.lastMatch?`<h3>${esc(S.club)} ${S.lastMatch.gf} × ${S.lastMatch.ga} ${esc(S.lastMatch.opponent)}</h3><p class="muted">${esc(S.lastMatch.competition)} • apito final</p>`:'<p>Você ainda não jogou. Prepare o elenco, escolha um treino e entre em campo.</p>';return panel('Próximo compromisso',`<p>${S.week>38?'Temporada encerrada':'Brasileirão • Rodada '+S.week+' / 38'}</p><button id="play" class="btn primary" ${S.week>38?'disabled':''}>▶ Simular partida</button><p class="muted">A partida mostra um radar tático animado, lances em texto e placar.</p>`)+panel('Último resultado',last+radar())+panel('Tabela do Brasileirão',standings())+panel('Diário da carreira',`<div class="log">${S.log.map(x=>`<div>• ${esc(x)}</div>`).join('')}</div>`)}
function squadView(){return panel('Elenco principal',`<p class="muted">Jogadores fictícios neste protótipo. Treinos e partidas afetam energia e moral.</p><div class="scroll"><table><thead><tr><th>Jogador</th><th>Pos.</th><th>GER</th><th>Energia</th><th>Moral</th><th>Situação</th></tr></thead><tbody>${S.squad.map((p,i)=>`<tr><td>${esc(p.name)}</td><td>${p.pos}</td><td>${p.rating}</td><td>${p.energy}%</td><td>${p.morale}%</td><td>${p.starter?'Titular':`<button class="btn smallbtn" data-promote="${i}">Escalar</button>`}</td></tr>`).join('')}</tbody></table></div>`)+panel('Resumo do elenco',`<p>Para escalar um reserva, escolha-o e informe o número do titular (1 a 11) que ele substituirá.</p><p>Média de habilidade: <b>${Math.round(S.squad.reduce((a,p)=>a+p.rating,0)/S.squad.length)}</b></p><p>Condição média: <b>${Math.round(S.squad.reduce((a,p)=>a+p.energy,0)/S.squad.length)}%</b></p>`)}
function trainingView(){let types={Ataque:'Desenvolve atacantes e meias (+1 habilidade para dois jogadores ofensivos), mas cansa o grupo.',Defesa:'Desenvolve defesa e goleiro (+1 habilidade para dois defensores), cansa o grupo.',Posse:'Melhora o meio-campo (+1 habilidade para dois meias) e dá confiança.',Recuperação:'Recupera 18 pontos de energia para todo elenco.'};return panel('Plano semanal',`<p>Escolha uma atividade para esta semana. Cada semana tem um treino.</p>${Object.entries(types).map(([k,v])=>`<div class="card"><div class="flex between"><b>${k}</b><button class="btn ${S.training===k?'primary':''}" data-training="${k}" ${S.training?'disabled':''}>${S.training===k?'Treino escolhido':'Escolher'}</button></div><small>${v}</small></div>`).join('')}<p>${S.training?'Treino da semana: <b>'+S.training+'</b>':'Nenhum treino escolhido ainda.'}</p>`)}
function tacticsView(){return panel('Quadro tático',`<p>Formação</p><div class="flex">${['4-3-3','4-4-2','3-5-2'].map(x=>`<button data-formation="${x}" class="btn ${S.formation===x?'primary':''}">${x}</button>`).join('')}</div><p>Postura da equipe</p><div class="flex">${['Defensivo','Equilibrado','Ofensivo'].map(x=>`<button data-mentality="${x}" class="btn ${S.mentality===x?'primary':''}">${x}</button>`).join('')}</div><hr style="border-color:var(--line)"><p><b>${S.formation}</b> • ${S.mentality}</p><small>Ofensivo aumenta a chance de marcar e de sofrer. Defensivo reduz o risco; a formação altera equilíbrio entre setores.</small>`)}
function calendarView(){return panel('Agenda da temporada',`<p>Brasileirão • pontos corridos em dois turnos</p><div class="scroll"><table><thead><tr><th>Rodada</th><th>Partida</th><th>Situação</th></tr></thead><tbody>${Array.from({length:38},(_,i)=>{let m=schedule(i+1).find(x=>x.includes(S.club));let played=i<S.week-1;let res=played&&S.lastMatch&&i===S.week-2?`${S.lastMatch.gf}–${S.lastMatch.ga} (seu time primeiro)`:played?'Jogado':'Agendado';return `<tr><td>${i+1}</td><td>${esc(m[0])} × ${esc(m[1])}</td><td>${res}</td></tr>`}).join('')}</tbody></table></div>`)}
function competitionsView(){let result=panel('Brasileirão Série A',`<p>${S.points} pontos • ${S.wins}V ${S.draws}E ${S.losses}D</p>${standings()}`);if(S.lib)result+=panel('Copa Libertadores • fase de grupos',`<p>Clubes brasileiros participantes nesta carreira: ${libTeams.map(esc).join(', ')}.</p><p>Seu grupo: ${[S.club,...S.lib.group].map(esc).join(' • ')}</p><p><b>${S.lib.pts} pontos</b> em ${S.lib.p} jogos — ${S.lib.w} vitórias, ${S.lib.d} empates, ${S.lib.l} derrotas.</p><p>${S.lib.history.map(esc).join('<br>')}</p><small>Simulação simplificada: até seis partidas separadas a cada três rodadas do Brasileirão; sem classificação completa nem mata-mata.</small>`);else result+=panel('Libertadores',`<p>Seu clube não está entre os representantes brasileiros da Libertadores nesta configuração. Escolha ${libTeams.map(esc).join(', ')} para ativar a competição no protótipo.</p>`);return result}
function marketView(){return panel('Mercado de transferências',`<p>Janela de transferências • orçamento disponível: <b>$${S.money} milhões</b></p><p>Uma contratação de demonstração custa $8 milhões. Os nomes e atributos deste mercado são fictícios.</p><div class="scroll"><table><thead><tr><th>Jogador</th><th>Pos.</th><th>GER</th><th>Idade</th><th>Valor</th><th></th></tr></thead><tbody>${S.squad.length<18?['GOL','ZAG','VOL','MEI','ATA'].map((pos,i)=>{let name=first[(S.week+i*3)%first.length]+' '+last[(S.week+i*5)%last.length];let rating=70+i,age=21+i;return `<tr><td>${name}</td><td>${pos}</td><td>${rating}</td><td>${age}</td><td>$8 mi</td><td><button data-buy="${i}" class="btn smallbtn" ${S.money<8?'disabled':''}>Contratar</button></td></tr>`}).join(''):'<tr><td colspan="6">Elenco cheio para este protótipo; venda de jogadores ainda não disponível.</td></tr>'}</tbody></table></div><small>Mercado simplificado, ainda sem negociações com outros clubes.</small>`)}
function renderView(tab){let target=$('view');let content=tab==='Visão geral'?overview():tab==='Elenco'?squadView():tab==='Treino'?trainingView():tab==='Táticas'?tacticsView():tab==='Calendário'?calendarView():tab==='Competições'?competitionsView():marketView();target.innerHTML=content;let play=$('play');if(play)play.onclick=()=>nextGame();target.querySelectorAll('[data-training]').forEach(b=>b.onclick=()=>{if(S.training)return;S.training=b.dataset.training;if(S.training==='Recuperação')S.squad.forEach(p=>p.energy=Math.min(100,p.energy+18));else{let ps=S.training==='Ataque'?['ATA','PD','PE','MEI']:S.training==='Defesa'?['GOL','ZAG','LD','LE','VOL']:['MC','MEI','VOL'];S.squad.filter(p=>ps.includes(p.pos)).slice(0,2).forEach(p=>p.rating=Math.min(95,p.rating+1));S.squad.forEach(p=>p.energy=Math.max(40,p.energy-5));S.morale=Math.min(98,S.morale+2)}S.log.unshift('Treino semanal realizado: '+S.training+'.');save()});target.querySelectorAll('[data-formation]').forEach(b=>b.onclick=()=>{S.formation=b.dataset.formation;save()});target.querySelectorAll('[data-mentality]').forEach(b=>b.onclick=()=>{S.mentality=b.dataset.mentality;save()});target.querySelectorAll('[data-promote]').forEach(b=>b.onclick=()=>{let reserve=S.squad[Number(b.dataset.promote)],starters=S.squad.filter(p=>p.starter);let list=starters.map((p,i)=>(i+1)+': '+p.name+' ('+p.pos+')').join('\n');let selection=prompt('Qual titular você quer substituir? Digite o número:\n'+list);if(selection===null)return;let n=Number(selection);if(!Number.isInteger(n)||n<1||n>11){alert('Escolha um número de 1 a 11.');return}starters[n-1].starter=false;reserve.starter=true;save()});target.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{if(S.money<8)return;let i=Number(b.dataset.buy),pos=['GOL','ZAG','VOL','MEI','ATA'][i],name=first[(S.week+i*3)%first.length]+' '+last[(S.week+i*5)%last.length];if(!confirm('Contratar '+name+' por $8 milhões?'))return;S.money-=8;S.squad.push({name,pos,rating:70+i,energy:100,morale:75,age:21+i,starter:false});S.log.unshift('Contratação de demonstração: '+name+'.');save()})}
